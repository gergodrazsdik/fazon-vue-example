# The library's checks: the framework pins (ADAPTER-003); on the runner, install, `fazon sync
# --check`, ESLint and Stylelint with Fazon's rules, the type-check of every file (stories and tests
# too), the browser tests, the builds and publint, which the reusable workflow doesn't run; and
# Fazon's reusable verify.yml at the pinned framework commit: every check in the pinned verifier
# image, the run's summary on the pull request, and its record and builds as artifacts.
---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework-pin:
    name: framework-pin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The packages, the workflow and the image name one framework commit
        run: scripts/check-framework-pin.sh

  library:
    name: library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The exact pnpm version package.json's packageManager names; no third-party setup action.
      - name: Install pnpm
        run: npm install -g "pnpm@$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)"  # zizmor: ignore[adhoc-packages]
      # Temporary, until the framework's packages install as git dependencies.
      - name: Build the pinned framework commit
        run: scripts/framework.sh
      - name: Install the dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Generated files are current (fazon sync --check)
        run: pnpm exec fazon sync --check
      - name: Lint (ESLint and Stylelint, with Fazon's rules)
        if: ${{ !cancelled() }}
        run: pnpm run lint
      - name: Type-check (vue-tsc)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: Install Chromium for Playwright
        if: ${{ !cancelled() }}
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test (Vitest in browser mode)
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Build the library (vite build)
        if: ${{ !cancelled() }}
        run: pnpm run build
      - name: Build Storybook
        if: ${{ !cancelled() }}
        run: pnpm run build-storybook
      - name: Pack and check the package (publint)
        if: ${{ !cancelled() }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          pnpm exec publint run "$RUNNER_TEMP"/package/*.tgz

  # The reusable workflow, at the framework commit the packages and the image name (ADAPTER-003).
  # Until M5 the install builds that commit from source first (scripts/framework.sh).
  fazon:
    uses: gergodrazsdik/fazon/.github/workflows/verify.yml@c0444c34ce22c5397c6a06c46faf24e0b2c5ac17
    permissions:
      contents: read
      id-token: write # only its judge job uses it, for workload identity federation
      pull-requests: write # only its comment job uses it
    # The judge's federation IDs, from the repository's variables: not secrets
    # (https://github.com/gergodrazsdik/fazon/blob/main/docs/spec/workflow.md#credentials).
    with:
      install-command: scripts/framework.sh && pnpm install --frozen-lockfile
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
